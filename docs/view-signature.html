<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Signature | WholeSoul Wellness</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="intro">
    <h1>Signature</h1>
    <p>Below is the submitted signature.</p>
    <img id="signatureImage" alt="Signature not available" style="margin:24px auto;border:1px solid #d7e4dd;border-radius:8px;background:#fff;">
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const data = params.get("data");
    if (data && data.startsWith("data:image")) {
      document.getElementById("signatureImage").src = decodeURIComponent(data);
    } else {
      document.getElementById("signatureImage").alt = "Invalid or missing signature.";
    }
  </script>
</body>
</html>
